services:
  # 1. The Shared Redis (Used by Backend, WS, and Coding Service)
  redis:
    image: redis:alpine
    container_name: scholarship_redis
    restart: always
    ports:
      - "6379:6379"

  # 2. The Main Backend API
  backend:
    build: ./backend
    container_name: scholarship_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL} # We will set this on the server
      - REDIS_URL=redis://redis:6379 # Connects to the service named 'redis' above
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis

  # 3. The WebSocket Server (Same code as backend, different command)
  websocket:
    build: ./backend
    container_name: scholarship_websocket
    restart: always
    command: ["node", "src/ws/server.js"]
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - backend

  # 4. The Coding Test Microservice
  coding_service:
    build: ./coding-test-service
    container_name: scholarship_coding_service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      # If your coding service needs to talk to the backend, use this internal URL:
      # - BACKEND_URL=http://backend:5000 
    depends_on:
      - redis

  # 5. The Frontend (React + Nginx)
  frontend:
    build: 
      context: ./frontend
    container_name: scholarship_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend